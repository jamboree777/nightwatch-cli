[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nightwatch-cli"
version = "0.1.0"
description = "NightWatch Intelligence Layer — CLI & SDK for token analysts and autonomous agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "NightWatch Team", email = "dev@nightwatch.io"}]
keywords = ["crypto", "token-analysis", "intelligence", "mining", "cherry"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial",
    "Environment :: Console",
]

dependencies = [
    "requests>=2.28.0",
    "click>=8.0",
    "rich>=13.0",
]

[project.optional-dependencies]
auto = ["anthropic>=0.40.0"]
dev = ["pytest>=7.0", "pytest-cov>=3.0"]

[project.scripts]
nw = "nightwatch_cli.cli:main"

[project.urls]
Homepage = "https://nightwatch-v1-frontend.onrender.com"
Documentation = "https://nightwatch-v1-frontend.onrender.com/docs"
API = "https://nightwatch-v1-api.onrender.com/docs"
